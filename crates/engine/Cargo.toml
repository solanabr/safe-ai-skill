[package]
name = "safe-ai-skill"
version = "1.3.1"
edition = "2021"
description = "safe-ai-skill engine: a hook-based security firewall and supply-chain verifier for Claude Code skills, MCPs and agents"
license = "MIT"
repository = "https://github.com/solanabr/safe-ai-skill"
homepage = "https://github.com/solanabr/safe-ai-skill"
keywords = ["security", "claude-code", "firewall", "mcp", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
# Ship what the build needs and nothing else: tests/ carries a corpus of malicious command
# shapes, which would only trip scanners (cargo package prints an "ignoring test" warning per
# dropped test target; expected). LICENSE is a symlink to the repo root's. README.md (from
# `readme`) and Cargo.lock (a binary crate, for `cargo install --locked`) are added by cargo.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/src/**/*.rs",
    "/src/bip39_english.txt",
    "/policy/shared/credentials.list",
    "/policy/shared/exfil-hosts.list",
    "/policy/shared/onchain-verbs.list",
    "/policy/shared/MANIFEST",
]

[[bin]]
name = "safe-ai-skill"
path = "src/main.rs"

[lib]
name = "safe_ai_skill"
path = "src/lib.rs"

[features]
# Test-only hooks (a crash trigger for the panic-ask path). Never enable for a release.
test-hooks = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parsing must return the exact f64 that was serialized, or the state MAC
# (computed over the stored value) fails on reload.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
glob = "0.3"
walkdir = "2"
bs58 = "0.5"
# rustls TLS only (no native-tls/OpenSSL); default features dropped for a lean binary.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Ed25519 session keypairs; the `rand_core` feature is for key generation.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# OS CSPRNG (`OsRng`) for confirmation nonces and the state MAC key. Already in the tree via
# ed25519-dalek; the `getrandom` feature reuses the getrandom crate rustls/ring already build.
rand_core = { version = "0.6", features = ["getrandom"] }
# zlib inflate for the read-only git object reader (`verify/gitobj.rs`, #10). Pure Rust, no
# unsafe in the inflate path; already in Rust std's own dependency tree (backtrace symbolization).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[target.'cfg(unix)'.dependencies]
# getpwuid_r (trusted home), geteuid, O_NOFOLLOW and flock. Already in the tree via getrandom.
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
