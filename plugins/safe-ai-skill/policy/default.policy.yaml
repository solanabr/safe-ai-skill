# safe-ai-skill default policy — the FULL schema (kept equivalent to the embedded
# DEFAULT_POLICY_YAML in crates/engine/src/policy/mod.rs). A project's
# <cwd>/.safe-ai-skill/policy.yaml may only tighten it, field by field: caps take the lower
# value, deny-lists add entries, allow-lists drop them; anything looser (and any profile
# setting) is ignored and listed at SessionStart. Every field below has a serde default so a
# partial override still parses.
version: 1
active_profile: strict    # strict | paranoid; autopilot only via a confirmed `safe-ai-skill mode autopilot`; env SAFE_AI_SKILL_PROFILE may only pick a stricter one
network:
  default: devnet
  mainnet: ask            # any mainnet-touching action → ask (never silent-allow)
spend:
  per_tx_sol_max: 1.0     # above → ask; above hard_max → deny
  hard_tx_sol_max: 10.0
  daily_sol_max: 5.0
mcp:
  # value-moving verbs matched in MCP tool names (expanded for heliusWrite staking + future tools)
  sensitive_name_pattern: "transfer|sign|swap|send|withdraw|burn|pay|upgrade|stake|delegate|mint|bridge|lend|borrow"
swap:
  rugcheck: true                # GET rugcheck report before allowing swaps (Phase 2)
  rugcheck_max_score: 40        # deny above
  rugcheck_timeout_ms: 3000     # on timeout/API-down → ask (never hard-block on third-party uptime)
  trusted_mints: [ "So11111111111111111111111111111111111111112", "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" ]
secrets:
  # Built-in classes (crates/engine/src/gates/secretpath.rs), matched case-insensitively on the
  # raw and the symlink-resolved path:
  #   hard deny (never relaxable): *-keypair.json, ~/.config/solana/** except cli/config.yml,
  #     ~/.ssh/id_*, ~/.superstack/config.json, the varlock key store, any file whose content is a
  #     keypair or holds a private-key block, id.json / *.pem / *.key when unreadable;
  #   env class (raw read denied, use `safe-ai-skill env keys|set|unset`): .env, .env.*, *.env,
  #     .envrc, .dev.vars, .varlock-frozen-env, ~/.config/solana/cli/config.yml.
  env_read: deny                      # `ask` = prompt for raw env-class reads instead (opt-in)
  deny_read_globs:                    # extra denies on top of the built-in classes
    - "**/*-keypair.json"
    - "~/.superstack/config.json"     # holds the plaintext Copilot JWT
  allow_read_globs:                   # readable despite the env class (never a hard-deny class)
    - "**/.env.example"
    - "**/.env.sample"
    - "**/.env.template"
    - "**/.env.dist"
    - "**/.env.schema"                # varlock schema: keys + decorators only; the read gate sniffs it
redact: { enabled: true }
audit:  { enabled: true }
catalog:
  # opt-in skill-registry catalog (every entry default_installed:false); safe-ai-skill forces ask/deny
  # on entries matching a high-risk class by id or by keyword in safety/description/tag text.
  registry_path: ".claude/skills/skill-registry.json"
  high_risk_classes:
    - kind: wallet_signing            # phantom-mcp: can sign/submit transactions
      decision: ask
      keywords: [ "wallet signing", "sign/submit", "signing" ]
      ids: [ "phantom-mcp" ]
    - kind: key_custody               # x402-proxy-mcp: BIP-39 key custody for agent payments
      decision: ask
      keywords: [ "key custody", "key-custody", "bip-39", "bip39" ]
      ids: [ "x402-proxy-mcp" ]
    - kind: installer_script          # ghostsecurity & friends: curl | bash installers
      decision: ask
      keywords: [ "curl | bash", "curl|bash", "| sh", "wget" ]
      ids: []
supply_chain:
  verify_skills_dirs: [ ".claude/skills" ]   # project skills; a project .safe-ai-skill/policy.yaml may add "~/.claude/skills" (the only out-of-project dir allowed) to also sweep user-scope skills
  flag_unpinned_mcp: true           # @latest in .mcp.json — INFORMATIONAL/LOW (MCPs kept @latest), not blocking
  flag_telemetry_curl: true         # generic telemetry preamble detector (e.g. Convex /api/mutation)
  verify_ext_submodules: true       # walk .claude/skills/ext/<name> as individual verifiable units
  ext_dir: ".claude/skills/ext"
  exec_install_scripts: ask         # runtime curl … | sh/bash gate: allow | ask | deny
  on_block: deny                    # blocked skill packs: deny in place | move to quarantine
# Hard guards (mainnet deploy, authority changes, account close, secret reads, irreversible
# flags) are built into the gates: no profile, grant or policy relaxes them. To turn the
# hooks off, set SAFE_AI_SKILL_DISABLE=1 (reported at SessionStart).
profiles:
  strict: {}                # the default
  autopilot:                # raised per-tx cap; needs a confirmed `safe-ai-skill mode autopilot`
    per_tx_sol_max: 2.0
  paranoid:                 # every allow becomes an ask; every Solana CLI command asks
    ask_all: true
