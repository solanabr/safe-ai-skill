# Release — safe-ai-skill
#
# A release tag must point at a commit that already contains the binaries it
# ships. v1.0.0 didn't (the tag predates the vendor commit), so a release now
# runs in this order (maintainer steps: docs/RELEASING.md):
#
#   1. Actions → Release → Run workflow on main, input `version` (e.g. 1.0.1):
#        preflight  dispatched from main; every manifest is at that version;
#                   neither tag exists yet
#        build      the five binaries, smoke-tested; musl and Windows built
#                   twice and compared byte for byte
#        attest     signs their build provenance (the only job with id-token)
#        vendor     commits them, stamps their sha256 into the shim, regenerates
#                   SHA256SUMS on release/vX.Y.Z and opens a PR
#   2. The maintainer merges the PR, tags the vendor commit vX.Y.Z and
#      safe-ai-skill--vX.Y.Z, and pushes both tags.
#   3. The vX.Y.Z push runs publish: it re-checks the tagged commit (versions,
#      twin tag, checksums, stamped shim, the linux-x64 binary's --version,
#      attestations made by this workflow on main), uploads exactly those
#      binaries to the GitHub Release, then runs the npm install e2e against it.
#
# Targets (artifact names unchanged since 1.0.0)
# ─────────────────────────────────────────────────────────────────────────────
# safe-ai-skill-darwin-arm64  aarch64-apple-darwin        macos-15, macOS ≥ 11.0
# safe-ai-skill-darwin-x64    x86_64-apple-darwin         macos-15, macOS ≥ 10.12
# safe-ai-skill-linux-x64     x86_64-unknown-linux-musl   ubuntu-24.04, static
# safe-ai-skill-linux-arm64   aarch64-unknown-linux-musl  ubuntu-24.04-arm, static
# safe-ai-skill-windows-x64.exe  x86_64-pc-windows-msvc   windows-2025, +crt-static
#
# Linux builds are static musl: 1.0.0's glibc build needed GLIBC_2.39 and exited
# 127 on Ubuntu 22.04 / Debian 12, which left the firewall silently off. ring
# compiles C, so musl-tools provides musl-gcc. ubuntu-24.04-arm is a native arm64
# runner (free for public repositories).
#
# Windows (1.1.0 tier: Git Bash only, spec D5.3) links the C runtime statically
# (+crt-static), so the .exe needs no VC++ redistributable, and links with
# /Brepro (no timestamp) so it can rebuild byte-identically. The release smoke
# checks the hard guards (scripts/gate-smoke.sh).
#
# Only the attest job can sign attestations (id-token + attestations write). It
# checks out nothing and runs two actions, pinned by commit SHA: download the
# build artifacts, attest them. The build job runs no third-party action and
# restores no cache either: rustup is preinstalled on GitHub's runners, and the
# toolchain is pinned below.
#
# Reproducibility: every build remaps the workspace and cargo home out of the
# binary (--remap-path-prefix). The musl and Windows builds are then cleaned
# and rebuilt, and the job fails unless both builds are byte-identical.
#
# Secrets
# ─────────────────────────────────────────────────────────────────────────────
# GITHUB_TOKEN — provided automatically.
# RELEASE_PAT  — optional fine-grained PAT (contents + pull_requests write). A PR
#                opened with GITHUB_TOKEN does not trigger CI; with RELEASE_PAT the
#                vendor PR runs CI, including the attestation check.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 1.0.1). Every manifest must already be at it."
        required: true
  push:
    tags:
      - "v*"

env:
  # Pinned so a release is rebuilt with the same compiler. Bump deliberately.
  RUST_TOOLCHAIN: "1.98.1"
  MANIFEST: crates/engine/Cargo.toml
  BIN_NAME: safe-ai-skill
  # Every shipped binary, as vendored into plugins/safe-ai-skill/bin/ and uploaded.
  BINARIES: >-
    safe-ai-skill-darwin-arm64 safe-ai-skill-darwin-x64
    safe-ai-skill-linux-x64 safe-ai-skill-linux-arm64
    safe-ai-skill-windows-x64.exe
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# One run per version: a second dispatch of the same version waits, then fails
# in vendor instead of racing the first one's release branch.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 1. built from main, versions agree, tags are free ─────────────────────
  preflight:
    name: Preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # publish and CI only accept attestations whose source ref is main.
      - name: Releases are built from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch the release from main, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check version and tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.2.3 (no leading v), got '$VERSION'"
            exit 1
          fi
          sh scripts/check-versions.sh "$VERSION"
          for t in "v$VERSION" "safe-ai-skill--v$VERSION"; do
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null || rc=$?
            case "$rc" in
              0) echo "::error::tag $t already exists. A released version is never rebuilt; bump the version."
                 exit 1 ;;
              2) ;;   # no such tag
              *) echo "::error::git ls-remote failed ($rc)"
                 exit 1 ;;
            esac
          done

  # ── 1. per-platform builds: smoke test, reproducibility ────────────────────
  build:
    name: Build / ${{ matrix.artifact_name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: safe-ai-skill-darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            macos_min: "11.0"

          - artifact_name: safe-ai-skill-darwin-x64
            os: macos-15
            target: x86_64-apple-darwin
            macos_min: "10.12"

          - artifact_name: safe-ai-skill-linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            repro: true

          - artifact_name: safe-ai-skill-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            repro: true

          - artifact_name: safe-ai-skill-windows-x64.exe
            os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: .exe
            # /Brepro: no link timestamp, so the clean rebuild can be byte-identical.
            rustflags: -C target-feature=+crt-static -C link-arg=/Brepro
            repro: true

    env:
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact_name }}
      EXE: ${{ matrix.exe }}
      EXTRA_RUSTFLAGS: ${{ matrix.rustflags }}
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          if ! command -v rustup >/dev/null; then
            echo "::error::rustup is not preinstalled on this runner image"
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # RUSTFLAGS replaces any target rustflags, so +crt-static rides along here.
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$cargo_home=/cargo $EXTRA_RUSTFLAGS"
          export RUSTFLAGS
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
          cargo build --manifest-path "$MANIFEST" --release --locked --target "$TARGET"
          cp "crates/engine/target/$TARGET/release/$BIN_NAME$EXE" "$ARTIFACT"

      - name: Reproducible — clean rebuild is byte-identical
        if: matrix.repro
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo clean --manifest-path "$MANIFEST"
          cargo build --manifest-path "$MANIFEST" --release --locked --target "$TARGET"
          if ! cmp "$ARTIFACT" "crates/engine/target/$TARGET/release/$BIN_NAME$EXE"; then
            echo "::error::$ARTIFACT differs between two clean builds of the same commit"
            exit 1
          fi
          echo "$ARTIFACT: two clean builds are byte-identical"

      - name: Smoke — static, runs on alpine / debian:11 / ubuntu:20.04 (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/smoke-static-linux.sh "./$ARTIFACT" "$VERSION"

      - name: Check minimum macOS version (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_MIN: ${{ matrix.macos_min }}
        run: |
          minos=$(otool -l "$ARTIFACT" | awk '
            /cmd LC_BUILD_VERSION/ { b = 1; next }
            /cmd LC_VERSION_MIN_MACOSX/ { v = 1; next }
            b && $1 == "minos" { print $2; exit }
            v && $1 == "version" { print $2; exit }')
          echo "$ARTIFACT: minimum macOS $minos"
          if [ "$minos" != "$MACOS_MIN" ]; then
            echo "::error::$ARTIFACT targets macOS $minos, expected $MACOS_MIN"
            exit 1
          fi

      # A dynamic CRT import names its DLL in the import table; crt-static leaves none.
      - name: Smoke — static CRT, --version (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          if grep -a -i -o -E 'vcruntime[0-9]+[a-z_0-9]*\.dll|api-ms-win-crt-[a-z0-9-]+\.dll|msvcp[0-9]+\.dll' "$ARTIFACT" | sort -u | grep .; then
            echo "::error::$ARTIFACT imports the dynamic C runtime; build with +crt-static"
            exit 1
          fi
          got=$("./$ARTIFACT" --version | tr -d '\r')
          if [ "$got" != "safe-ai-skill $VERSION" ]; then
            echo "::error::$ARTIFACT --version says '$got', expected 'safe-ai-skill $VERSION'"
            exit 1
          fi
          echo "$got"

      - name: Gate smoke — hard guards hold (Windows)
        if: runner.os == 'Windows'
        run: sh scripts/gate-smoke.sh "./$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

  # ── 1. sign build provenance for exactly the built artifacts ───────────────
  # The only job that can mint an OIDC token. No checkout, no repo code, two
  # SHA-pinned actions.
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write       # sign the build-provenance attestation
      attestations: write   # store it
    steps:
      - name: Download built binaries (from this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/safe-ai-skill-darwin-arm64
            dist/safe-ai-skill-darwin-x64
            dist/safe-ai-skill-linux-x64
            dist/safe-ai-skill-linux-arm64
            dist/safe-ai-skill-windows-x64.exe

  # ── 1. vendor the binaries into plugins/safe-ai-skill/bin/ (PR) ───────────
  # The committed plugin binaries are what the Claude marketplace install
  # ships, so they land before the tag. Opens a PR (never pushes the base
  # branch) so a human reviews the binary diff.
  vendor:
    name: Vendor binaries (PR)
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push release/vX.Y.Z
      pull-requests: write   # open the PR
    env:
      VERSION: ${{ inputs.version }}
      BASE: ${{ github.ref_name }}
    steps:
      # The same commit the binaries were built from, not the branch head.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # merge-multiple flattens every artifact into dist/ directly (no per-artifact
      # subdirs), so the binary filenames don't collide with directory names.
      - name: Download built binaries (from this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      # The shim refuses a prebuilt whose sha256 differs from its stamped constant
      # (spec D6.1), so the stamp lands in the same commit as the binaries.
      - name: Stage binaries, stamp the shim, regenerate SHA256SUMS
        run: |
          set -euo pipefail
          bindir=plugins/safe-ai-skill/bin
          for f in $BINARIES; do
            install -m 0755 "dist/$f" "$bindir/$f"
          done
          sh scripts/stamp-shim.sh "$bindir"
          sh scripts/stamp-shim.sh --check "$bindir"
          # SHA256SUMS covers the stamped shim + every binary (what verify-plugin-bin checks).
          # shellcheck disable=SC2086 # one word per file
          ( cd "$bindir" && sha256sum safe-ai-skill $BINARIES > SHA256SUMS && sha256sum -c SHA256SUMS )

      - name: Commit on release/v${{ inputs.version }} and open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/safe-ai-skill/bin; then
            echo "::notice::$GITHUB_SHA already contains these binaries; tag it directly (docs/RELEASING.md)."
            exit 0
          fi
          BRANCH="release/v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add plugins/safe-ai-skill/bin
          git commit -m "release: vendor v${VERSION} platform binaries"
          # Never overwrite binaries that may already be under review.
          rc=0
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null || rc=$?
          case "$rc" in
            2) git push origin "$BRANCH" ;;
            0) git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
               if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                 echo "::error::$BRANCH already exists with different binaries. Close its PR and delete the branch, or bump the version."
                 exit 1
               fi
               echo "::notice::$BRANCH already holds these exact files; not pushing." ;;
            *) echo "::error::git ls-remote failed ($rc)"
               exit 1 ;;
          esac
          BODY="Automated: vendors the five v${VERSION} binaries, the shim stamped with their sha256 and a regenerated SHA256SUMS into plugins/safe-ai-skill/bin/, built and attested by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from ${GITHUB_SHA}. Merge with a merge commit (not squash or rebase), then tag this PR's head commit v${VERSION} and safe-ai-skill--v${VERSION} and push both tags; the tag push publishes the release. See docs/RELEASING.md."
          if ! out=$(gh pr create --base "$BASE" --head "$BRANCH" --title "release: vendor v${VERSION} platform binaries" --body "$BODY" 2>&1); then
            case "$out" in
              *"already exists"*) echo "::notice::$out" ;;
              *) echo "$out" >&2
                 exit 1 ;;
            esac
          fi
          echo "$out"

  # ── 3. publish the release from the tagged commit's binaries ──────────────
  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      attestations: read    # gh attestation verify
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sh scripts/check-versions.sh "$version"
          twin="safe-ai-skill--v${version}"
          git fetch --no-tags --depth=1 origin "refs/tags/${twin}:refs/tags/${twin}"
          if [ "$(git rev-parse "${twin}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::${twin} must point at the same commit as ${TAG}"
            exit 1
          fi
          sh scripts/stamp-shim.sh --check plugins/safe-ai-skill/bin
          cd plugins/safe-ai-skill/bin
          sha256sum -c SHA256SUMS
          # The binary users get must be the version being tagged, not a stale vendor.
          got=$(./safe-ai-skill-linux-x64 --version)
          if [ "$got" != "safe-ai-skill $version" ]; then
            echo "::error::committed safe-ai-skill-linux-x64 --version says '$got', expected 'safe-ai-skill $version'"
            exit 1
          fi
          for f in $BINARIES; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main
          done

      - name: Create the GitHub Release from the committed binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir dist
          for f in $BINARIES; do
            cp "plugins/safe-ai-skill/bin/$f" dist/
          done
          # shellcheck disable=SC2086 # one word per file
          ( cd dist && sha256sum $BINARIES > SHA256SUMS && cat SHA256SUMS )
          set --
          for f in $BINARIES; do set -- "$@" "dist/$f"; done
          gh release create "$TAG" \
            --verify-tag \
            --title "safe-ai-skill $TAG" \
            --generate-notes \
            "$@" \
            dist/SHA256SUMS

  # A release created with GITHUB_TOKEN doesn't fire the `release` event, so the
  # npm e2e is called directly once the assets are live.
  npm-e2e:
    name: npm install e2e
    needs: publish
    uses: ./.github/workflows/npm-e2e.yml
