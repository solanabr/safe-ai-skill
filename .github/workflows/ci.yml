# CI — safe-ai-skill
#
# Runs on every push and PR. Builds and tests the safe-ai-skill engine crate
# across all three shipping platforms, then verifies the committed
# plugin binary checksum and shim syntax.
#
# NOTE: There is no workspace Cargo.toml at the repo root; the engine
# crate lives at crates/engine/ and all cargo commands use
# --manifest-path crates/engine/Cargo.toml explicitly.  Adding a
# minimal workspace root was considered but the crate builds cleanly
# without it, and adding one would require touching Cargo files that
# are marked FROZEN by the round-2 contract in ARCHITECTURE.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"   # same pin as release.yml; bump both together
  MANIFEST: crates/engine/Cargo.toml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── lint (fmt + clippy) ───────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest     # fast, free, consistent lint runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/engine/target
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/Cargo.lock') }}
          restore-keys: |
            cargo-lint-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt --check
        run: cargo fmt --manifest-path ${{ env.MANIFEST }} --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path ${{ env.MANIFEST }} --all-targets -- -D warnings

  # ── build + test matrix ──────────────────────────────────────────────────
  build-test:
    name: Build + test / ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15          # GitHub-hosted M-series runner (aarch64-apple-darwin)
            plat: darwin-arm64
          - name: linux-x64
            os: ubuntu-latest     # x86_64-unknown-linux-gnu
            plat: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/engine/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo build --verbose
        run: cargo build --manifest-path ${{ env.MANIFEST }} --verbose

      - name: cargo test --verbose
        run: cargo test --manifest-path ${{ env.MANIFEST }} --verbose

      # Prove the npm launcher stub (bin/cli.js) resolves and execs the binary.
      # No network: we use the freshly built binary, not a release download.
      - name: npm launcher smoke (no network)
        shell: bash
        run: |
          set -euo pipefail
          bin="crates/engine/target/debug/safe-ai-skill"
          test -x "$bin"
          mkdir -p npm/bin
          cp "$bin" "npm/bin/safe-ai-skill-${{ matrix.plat }}"
          node --check npm/bin/cli.js
          out=$(node npm/bin/cli.js status)
          echo "$out"
          echo "$out" | grep -q '"command":"status"'

  # ── cross-build (darwin-x64, build-only) ──────────────────────────────────
  # release.yml ships four binaries; the build-test matrix above only builds +
  # tests the two NATIVE targets and linux-musl below covers both Linux ones.
  # Foreign-arch tests can't run on these runners, so here we BUILD darwin-x64
  # to catch compile regressions on that target before a release tag.
  cross-build:
    name: Cross-build / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin       # darwin-x64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/engine/target
          key: cargo-cross-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('crates/engine/Cargo.lock') }}
          restore-keys: |
            cargo-cross-${{ runner.os }}-${{ matrix.target }}-

      - name: Build
        run: cargo build --manifest-path ${{ env.MANIFEST }} --release --locked --target ${{ matrix.target }}

  # ── Linux release targets: static musl build + container smoke ────────────
  # Builds the two Linux targets exactly as release.yml does (preinstalled
  # rustup, pinned toolchain, --locked, musl-gcc for ring's C code), then proves
  # each binary is static and runs on alpine, debian:11 and ubuntu:20.04.
  linux-musl:
    name: Linux static (musl) / ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl    # linux-x64
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl   # linux-arm64 (native arm64 runner)
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null; then
            echo "::error::rustup is not preinstalled on this runner image (release.yml relies on it)"
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/engine/target
          key: cargo-musl-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('crates/engine/Cargo.lock') }}
          restore-keys: |
            cargo-musl-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build (release, --locked)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --manifest-path ${{ env.MANIFEST }} --release --locked --target ${{ matrix.target }}

      - name: Smoke — static, runs on alpine / debian:11 / ubuntu:20.04
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/engine/Cargo.toml | head -n1)
          sh scripts/smoke-static-linux.sh "crates/engine/target/$TARGET/release/safe-ai-skill" "$version"

  # ── committed binaries carry release.yml build provenance ─────────────────
  # SHA256SUMS sits next to the binaries it hashes, so it only catches
  # accidents. Every committed binary must have a build-provenance attestation
  # from this repo's release.yml, run on release/v<version> for the version in
  # plugin.json (release.yml builds and vendors there; docs/RELEASING.md).
  verify-attestations:
    name: Verify binary provenance
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4

      - name: gh attestation verify (committed binaries)
        env:
          GH_TOKEN: ${{ github.token }}
          # The canonical repo, so CI on a fork checks against upstream's attestations.
          RELEASE_REPO: solanabr/safe-ai-skill
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            plugins/safe-ai-skill/.claude-plugin/plugin.json | head -n1)
          cd plugins/safe-ai-skill/bin
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            gh attestation verify "safe-ai-skill-$p" \
              --repo "$RELEASE_REPO" \
              --signer-workflow "$RELEASE_REPO/.github/workflows/release.yml" \
              --source-ref "refs/heads/release/v${version}"
          done

  # ── committed binaries are the manifest version ───────────────────────────
  # Required check. hooks.json and the shim must never reach main ahead of the
  # binaries they call: a 1.0.0 engine answers `allow` to subcommands it doesn't
  # know. Each runner runs its native binary (--version) and checks the others
  # embed "safe-ai-skill <version>". Fails until release.yml has vendored the
  # binaries for the version in plugin.json.
  binary-versions:
    name: Binary versions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: scripts/check-binary-versions.sh
        run: sh scripts/check-binary-versions.sh

  # ── plugin binary checksum + shim syntax ─────────────────────────────────
  verify-plugin-bin:
    name: Verify committed plugin binaries
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SHA256SUMS (committed binaries)
        working-directory: plugins/safe-ai-skill/bin
        run: |
          # sha256sum ships with GNU coreutils on ubuntu-latest; the format
          # in SHA256SUMS is "<hash>  <filename>" (two spaces), standard output.
          sha256sum -c SHA256SUMS

      - name: Shim is executable
        run: test -x plugins/safe-ai-skill/bin/safe-ai-skill

      - name: Shim passes sh -n (syntax check)
        run: sh -n plugins/safe-ai-skill/bin/safe-ai-skill

  # ── shim failure contract (fake uname + fake engines, no build) ─────────
  # /bin/sh is dash on Ubuntu and bash 3.2 on macOS; the script also runs dash and
  # bash --posix wherever they exist.
  shim-tests:
    name: Shim tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (shim + test)
        if: runner.os == 'Linux'
        run: shellcheck plugins/safe-ai-skill/bin/safe-ai-skill scripts/test-shim.sh

      - name: scripts/test-shim.sh
        run: sh scripts/test-shim.sh

  # ── package + script checks (npm wrapper, install.sh, version consistency) ─
  package-checks:
    name: Package + script checks
    runs-on: ubuntu-latest      # ships shellcheck + node preinstalled
    steps:
      - uses: actions/checkout@v4

      - name: node --check (npm wrapper)
        run: |
          node --check npm/bin/cli.js
          node --check npm/scripts/postinstall.js

      - name: shellcheck (install.sh + scripts)
        run: shellcheck install.sh scripts/check-versions.sh scripts/check-binary-versions.sh scripts/smoke-static-linux.sh scripts/test-smoke-static-linux.sh

      - name: sh -n (install.sh + scripts)
        run: |
          sh -n install.sh
          sh -n scripts/check-versions.sh
          sh -n scripts/check-binary-versions.sh
          sh -n scripts/smoke-static-linux.sh
          sh -n scripts/test-smoke-static-linux.sh

      - name: smoke-static-linux.sh logic (stubbed readelf + docker)
        run: sh scripts/test-smoke-static-linux.sh

      - name: Version consistency across manifests
        run: sh scripts/check-versions.sh
