# npm install e2e — safe-ai-skill
#
# Proves the FULL published install path end to end: `npm pack` the wrapper,
# install the tarball, let scripts/postinstall.js download the real release
# binary, verify its SHA-256 against the published SHA256SUMS, and exec it.
#
# This depends on published GitHub Release assets (the binaries + SHA256SUMS for
# the package's version tag), so it does NOT run on every PR. It runs:
#   • from release.yml right after it publishes (a release created with
#     GITHUB_TOKEN doesn't fire the `release` event),
#   • on release publish (a release created by hand),
#   • on a weekly schedule (catch release/asset drift), and
#   • manually via workflow_dispatch.

name: npm install e2e

on:
  release:
    types: [published]
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:
  workflow_call:

jobs:
  # The scheduled run tests whatever version the manifest declares; before that version is
  # released there is nothing to download, so skip with a notice. Every other trigger runs
  # unconditionally (a missing release there is a real failure).
  release-present:
    name: release for manifest version exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' npm/package.json | head -n1)
          if [ "$EVENT" != schedule ] || gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub Release v${version} yet; skipping the scheduled npm install e2e."
          fi

  npm-install:
    name: npm install + verify + exec / ${{ matrix.os }}
    needs: release-present
    if: needs.release-present.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pack the npm wrapper
        working-directory: npm
        run: |
          tarball=$(npm pack | tail -n1)
          echo "TARBALL=$PWD/$tarball" >> "$GITHUB_ENV"

      - name: Install globally (runs postinstall download + checksum verify)
        run: |
          prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$prefix"
          npm install -g --prefix "$prefix" "$TARBALL"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Smoke — exec the installed CLI
        run: |
          out=$(safe-ai-skill status)
          echo "$out"
          echo "$out" | grep -q '"command":"status"'

  # The Linux binaries are static musl builds. Install the packed wrapper in a
  # musl distro (alpine) and an older glibc one (Debian 11), on x64 and arm64.
  # `docker run` from the host: JavaScript actions don't run inside Alpine
  # containers on arm64.
  npm-install-container:
    name: npm install + exec / ${{ matrix.image }} / ${{ matrix.os }}
    needs: release-present
    if: needs.release-present.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["node:22-alpine", "node:22-bullseye"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack the npm wrapper
        working-directory: npm
        run: |
          tarball=$(npm pack | tail -n1)
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Install + exec inside the container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e TARBALL -v "$PWD/npm:/pkg:ro" "$IMAGE" sh -euc '
            npm install -g "/pkg/$TARBALL"
            out=$(safe-ai-skill status)
            echo "$out"
            echo "$out" | grep -q "\"command\":\"status\""
          '
